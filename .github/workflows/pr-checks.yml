name: PR checks

# Valida que una PR no rompe la web antes de fusionarla. Automerge se dispara al terminar
# este workflow con éxito en PRs con la etiqueta `automerge`.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.158.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/validate-contracts/go.mod
          cache: true
          cache-dependency-path: |
            tools/validate-contracts/go.mod
            tools/validate-contracts/go.sum

      - name: Configure Hugo cache
        run: echo "HUGO_CACHEDIR=${RUNNER_TEMP}/hugo_cache" >> "$GITHUB_ENV"

      - name: Cache Hugo
        uses: actions/cache@v6
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-hugo-${{ env.HUGO_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hugo-${{ env.HUGO_VERSION }}-

      - name: Install Hugo CLI
        run: |
          if command -v hugo >/dev/null 2>&1 && hugo version | grep -Fq "v${HUGO_VERSION}+extended"; then
            hugo version
            exit 0
          fi
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 \
            --output "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Download Hugo modules
        run: hugo mod tidy

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Madrid
        run: hugo --gc --minify --buildFuture --panicOnWarning

      - name: Validate App Links file
        run: test -f ./public/.well-known/assetlinks.json

      - name: Run existing Node tests
        run: npm run test:autopick

      - name: Run Go tests (validator)
        run: cd tools/validate-contracts && go test ./...

      - name: Validate API contracts
        run: SKIP_HUGO_BUILD=1 make validate-contracts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Run Python tests
        run: cd .github/scripts && python -m pytest -q

      - name: Validate changed data
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python .github/scripts/validate_data.py --base "origin/${BASE_REF}" --branch "${HEAD_REF}"
