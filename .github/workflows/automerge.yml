name: Automerge

# Fusiona las PRs con la etiqueta `automerge` cuando "PR checks" termina con éxito.
# main no está protegida (el CMS publica noticias directamente), así que el merge se hace
# aquí tras la validación en lugar de con `gh pr merge --auto`.
on:
  workflow_run:
    workflows:
      - PR checks
    types:
      - completed

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.PUSH }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ -z "$PR" ]]; then
            echo "La ejecución no está asociada a ninguna PR"
            exit 0
          fi

          INFO=$(gh pr view "$PR" --repo "$REPO" --json labels,isDraft,headRefOid,state)
          echo "$INFO"

          if [[ "$(jq -r '.state' <<< "$INFO")" != "OPEN" ]]; then
            echo "PR #$PR no está abierta"
            exit 0
          fi
          if ! jq -e '.labels | map(.name) | index("automerge")' <<< "$INFO" > /dev/null; then
            echo "PR #$PR no tiene la etiqueta automerge"
            exit 0
          fi
          if [[ "$(jq -r '.isDraft' <<< "$INFO")" == "true" ]]; then
            echo "PR #$PR es borrador"
            exit 0
          fi
          if [[ "$(jq -r '.headRefOid' <<< "$INFO")" != "$HEAD_SHA" ]]; then
            echo "PR #$PR tiene commits más nuevos que los validados; se esperará a su validación"
            exit 0
          fi

          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
