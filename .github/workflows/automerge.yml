name: Automerge

# Fusiona las PRs con la etiqueta `automerge` cuando "PR checks" termina con éxito.
# La ruleset "Main" exige el check `validate` de "PR checks" (el CMS de noticias está en su lista
# de bypass y publica directamente); este workflow hace el merge en cuanto ese check pasa.
on:
  workflow_run:
    workflows:
      - PR checks
    types:
      - completed

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    steps:
      # Se ejecuta el validador de main; el contenido de la PR solo se lee como datos.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # main puede haber avanzado mientras corrían las comprobaciones (p. ej. la pasada manual de
      # phins-stats): se repite la protección contra pisados de las ramas auto/* con el main actual.
      - name: Re-check auto branch against current main
        if: startsWith(github.event.workflow_run.head_branch, 'auto/')
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "::error::Rama auto/* desde otro repositorio ($HEAD_REPO)"
            exit 1
          fi
          git fetch origin "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/pr" "$HEAD_SHA"
          cd "$RUNNER_TEMP/pr"
          python3 "$GITHUB_WORKSPACE/.github/scripts/validate_data.py" --base origin/main --branch "$HEAD_BRANCH" --root .

      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.PUSH }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ -z "$PR" ]]; then
            echo "La ejecución no está asociada a ninguna PR"
            exit 0
          fi

          INFO=$(gh pr view "$PR" --repo "$REPO" --json labels,isDraft,headRefOid,state)
          echo "$INFO"

          if [[ "$(jq -r '.state' <<< "$INFO")" != "OPEN" ]]; then
            echo "PR #$PR no está abierta"
            exit 0
          fi
          if ! jq -e '.labels | map(.name) | index("automerge")' <<< "$INFO" > /dev/null; then
            echo "PR #$PR no tiene la etiqueta automerge"
            exit 0
          fi
          if [[ "$(jq -r '.isDraft' <<< "$INFO")" == "true" ]]; then
            echo "PR #$PR es borrador"
            exit 0
          fi
          if [[ "$(jq -r '.headRefOid' <<< "$INFO")" != "$HEAD_SHA" ]]; then
            echo "PR #$PR tiene commits más nuevos que los validados; se esperará a su validación"
            exit 0
          fi

          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
