name: Check for new podcast episodes

# Backup of the Raspberry Pi's RSS checker (ivoox-scrapper). Reads the iVoox
# feed natively and opens a PR only for episodes the Pi has not added after
# the grace period.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

concurrency:
  group: check-new-podcast-episodes
  cancel-in-progress: false

jobs:
  check-episodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test backup scripts
        run: python3 -m unittest discover -s scripts/backup

      - name: Add new podcast episodes
        env:
          BACKUP_GRACE_MINUTES: "60"
        run: python3 scripts/backup/episodes.py --data data

      - name: Validate no duplicate episodes
        run: |
          python3 - << 'EOF'
          import json, glob, sys, collections
          errors = []
          for fpath in sorted(glob.glob('data/season_*.json')):
              try:
                  data = json.load(open(fpath, encoding='utf-8'))
              except Exception as e:
                  errors.append(f"{fpath}: error al leer JSON: {e}")
                  continue
              seen = collections.Counter(i.get('link', '') for i in data if i.get('link'))
              dups = [k for k, v in seen.items() if v > 1]
              if dups:
                  errors.append(f"{fpath}: {len(dups)} episode(s) duplicado(s)")
                  for d in dups[:3]:
                      errors.append(f"  - {d}")
          if errors:
              print("❌ Duplicados detectados — abortando commit:")
              for e in errors:
                  print(e)
              sys.exit(1)
          print("✅ Sin duplicados")
          EOF

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.PUSH }}
        run: scripts/backup/open_pr.sh backup-podcast-episodes "Added new podcast episodes (GitHub backup)" "Added new podcast episodes"
