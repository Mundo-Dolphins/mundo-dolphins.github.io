name: Check for new social posts

# Backup of the Raspberry Pi's social checker (ivoox-scrapper). Reads the
# Bluesky RSS feeds natively and opens a PR only for posts the Pi has not
# added after the grace period. Instagram is only handled on the Pi.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [social-check]
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: check-new-social-posts
  cancel-in-progress: false

jobs:
  check-social:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test backup scripts
        run: python3 -m unittest discover -s scripts/backup

      - name: Add new Bluesky posts
        env:
          BACKUP_GRACE_MINUTES: "30"
        run: python3 scripts/backup/social.py --data data

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.PUSH }}
        run: scripts/backup/open_pr.sh backup-social-posts "Added new social posts (GitHub backup)" "Added new social posts"
